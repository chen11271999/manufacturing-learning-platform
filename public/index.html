<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>制造业英语-马来语学习平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login/Register Modal -->
    <div id="authModal" class="modal active">
        <div class="modal-content">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchAuthTab('login')">登录</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">注册</button>
            </div>
            <div id="loginForm" class="auth-form">
                <h2>欢迎回来</h2>
                <input type="text" id="loginUsername" placeholder="用户名">
                <input type="password" id="loginPassword" placeholder="密码">
                <button onclick="login()" class="btn-primary">登录</button>
                <div id="loginError" class="error"></div>
            </div>
            <div id="registerForm" class="auth-form" style="display:none">
                <h2>创建账号</h2>
                <input type="text" id="regUsername" placeholder="用户名">
                <input type="password" id="regPassword" placeholder="密码">
                <input type="text" id="regDepartment" placeholder="部门（可选）">
                <button onclick="register()" class="btn-primary">注册</button>
                <div id="regError" class="error"></div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none">
        <header class="header">
            <div class="header-content">
                <h1>🏭 制造业英语-马来语学习平台</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <span id="userPoints" class="points-badge">⭐ 0</span>
                    <button id="adminBtn" style="display:none" onclick="switchTab('admin', {target:document.getElementById('adminNavItem')})">⚙️管理</button>
                    <button onclick="logout()" class="btn-logout">退出</button>
                </div>
            </div>
        </header>

        <nav class="nav">
            <div class="nav-item active" onclick="switchTab('vocab', event)">📚 词汇</div>
            <div class="nav-item" onclick="switchTab('dialogue', event)">💬 对话</div>
            <div class="nav-item" onclick="switchTab('listening', event)">🎧 听力</div>
            
            <div class="nav-item" onclick="switchTab('writing', event)">✍️ 写作</div>
            <div class="nav-item" onclick="switchTab('leaderboard', event)">🏆 排行</div>
            <div class="nav-item" id="adminNavItem" style="display:none" onclick="switchTab('admin', event)">⚙️ 管理</div>
        </nav>

        <main class="content">
            <!-- Vocabulary Section -->
            <section id="vocab-section" class="section active">
                <div class="section-header">
                    <h2>专业词汇库</h2>
                    <div class="vocab-stats">
                        <span id="vocabProgress">已学: 0 / 0</span>
                    </div>
                </div>
                <div class="category-grid" id="categoryGrid"></div>
                <div class="vocab-list" id="vocabList" style="display:none"></div>
            </section>

            <!-- Dialogue Section -->
            <section id="dialogue-section" class="section">
                <div class="section-header">
                    <h2>情景对话</h2>
                </div>
                <div id="dialogueContent"></div>
            </section>

            <!-- Listening Section -->
            <section id="listening-section" class="section">
                <div class="listening-container">
                    <h2>🎧 听力训练</h2>
                    <div style="background:#f0f4ff;padding:12px;border-radius:8px;margin-bottom:20px;font-size:13px">
                        <strong>积分规则：</strong>首次拼对 +2分 | 第2次拼对 +0分 | 2次都错 +0分且纳入错题本
                    </div>
                    <div class="listening-controls" style="margin-bottom:20px">
                        <button class="control-btn" onclick="startListening()" style="font-size:18px;padding:15px 40px">🚀 开始训练</button>
                        <button class="control-btn secondary" onclick="playListening()">🔊 再听一次</button>
                    </div>
                    <div class="word-display" id="listeningWord" style="font-size:48px;margin:30px 0;letter-spacing:8px;font-family:monospace">点击"开始训练"按钮</div>
                    <div id="listeningMeaning" style="text-align:center;font-size:20px;color:#6c757d;margin-bottom:20px;min-height:30px"></div>
                    <div class="answer-input" style="max-width:500px;margin:0 auto">
                        <input type="text" id="listeningAnswer" placeholder="输入单词拼写..." onkeypress="if(event.key==='Enter')checkListening()" style="text-align:center;font-size:20px;padding:15px">
                        <button onclick="checkListening()" class="btn-primary" style="padding:15px 25px;font-size:18px">✅ 检查</button>
                    </div>
                    <div id="listeningAttempt" style="text-align:center;margin:8px 0;font-size:14px;color:#6c757d"></div>
                    <div id="listeningFeedback" style="text-align:center;margin:8px 0;font-size:16px;min-height:24px"></div>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value" id="correctCount">0</div>
                            <div class="stat-label">首次正确</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalCount">0</div>
                            <div class="stat-label">总题数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="accuracy">0%</div>
                            <div class="stat-label">准确率</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="wrongCount" style="color:#dc3545">0</div>
                            <div class="stat-label">错题数</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Writing Section -->
            <section id="writing-section" class="section">
                <div class="section-header">
                    <h2>✍️ 商务写作</h2>
                </div>
                <div id="writingContent"></div>
            </section>

            <!-- Leaderboard Section -->
            <section id="leaderboard-section" class="section">
                <div class="section-header">
                    <h2>🏆 学习排行榜</h2>
                    <div class="leaderboard-tabs">
                        <button class="lb-tab active" onclick="loadLeaderboard('daily')">今日</button>
                        <button class="lb-tab" onclick="loadLeaderboard('weekly')">本周</button>
                        <button class="lb-tab" onclick="loadLeaderboard('all')">总榜</button>
                    </div>
                </div>
                <div id="leaderboardContent" class="leaderboard-list"></div>
            </section>
        <section id="admin-section" class="section">
                <div class="section-header"><h2>⚙️ 管理后台</h2></div>
                <div id="adminContent"></div>
            </section>
        </main>
    </div>

    <script src="js/vocabulary.js"></script>
    <script src="js/vocabulary-extra.js"></script>
    <script src="js/dialogues.js"></script>
    <script src="js/malay.js"></script>
    <script src="js/writing.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
